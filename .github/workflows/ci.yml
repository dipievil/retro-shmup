name: CI

on:
  push:
    branches: [dev, main]
    # Tag pushes use the tag as the artifact version; other refs use "dev".
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gdtoolkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gdtoolkit==4.5.0
      # Report-only until the existing scripts are clean: 16 gdlint findings and
      # 5 unformatted files on dev (see tools/run_all.sh --lint).
      - name: gdlint (report-only)
        continue-on-error: true
        run: gdlint scripts
      - name: gdformat --check (report-only)
        continue-on-error: true
        run: gdformat --check scripts

  test:
    name: Test (Godot ${{ matrix.godot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.3 is the engine pinned in project.godot; 4.7.2 is the current stable.
        godot: ["4.3", "4.7.2"]
    container:
      image: barichello/godot-ci:${{ matrix.godot }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3 for the asset validators
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3
      - name: Import, validators and test suites
        run: tools/run_all.sh

  export:
    name: Export (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Project is pinned to 4.3; the test matrix still covers 4.7.2.
    container:
      image: barichello/godot-ci:4.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            preset: Linux
            output: build/linux/retro-shmup.x86_64
            artifact_path: build/linux/
            smoke: native
          - target: windows
            preset: Windows
            output: build/windows/retro-shmup.exe
            artifact_path: build/windows/
            smoke: pack
          - target: macos
            preset: macOS
            output: build/macos/retro-shmup.app
            artifact_path: build/macos/
            smoke: pack
    steps:
      - uses: actions/checkout@v4
      # The image ships export templates under /root; container jobs run with
      # HOME=/github/home, so link them where Godot looks for them.
      - name: Link export templates
        run: |
          mkdir -p ~/.local/share/godot
          ln -sfn /root/.local/share/godot/export_templates ~/.local/share/godot/export_templates
      - name: Derive artifact name
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="dev" ;;
          esac
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          # e.g. retro-shmup-dev-1a2b3c4-linux / retro-shmup-0.5.0-1a2b3c4-macos
          artifact="retro-shmup-${version}-${short_sha}-${{ matrix.target }}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.target }}" = "macos" ]; then
            # The macOS artifact is a tarball with the exact same name: release
            # packaging matches `retro-shmup-*` and derives the extension from
            # the artifact name, so the name must not gain a suffix.
            echo "upload_path=build/$artifact" >> "$GITHUB_OUTPUT"
          else
            echo "upload_path=${{ matrix.artifact_path }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Export ${{ matrix.target }}
        run: |
          mkdir -p "$(dirname "${{ matrix.output }}")"
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output }}"
      - name: Validate exported artifact
        run: |
          output="${{ matrix.output }}"
          if [ -f "$output" ]; then
            size="$(stat -c '%s' "$output")"
            unit=bytes
          elif [ -d "$output" ]; then
            size="$(du -sk "$output" | cut -f1)"
            unit=KB
          else
            echo "::error::export output not found: $output"
            exit 1
          fi
          if [ "$size" -le 0 ]; then
            echo "::error::export output is empty: $output"
            exit 1
          fi
          echo "Exported $output ($size $unit)"
      - name: Smoke test exported build
        # Container jobs default to `sh -e`, so keep this POSIX-compatible.
        run: |
          run_smoke() {
            if timeout 60 "$@" > smoke.log 2>&1; then
              cat smoke.log
            else
              status=$?
              cat smoke.log
              echo "::error::exported build smoke exited ${status}"
              exit "${status}"
            fi
          }
          if [ "${{ matrix.smoke }}" = "native" ]; then
            # Linux binary can be launched directly on this runner.
            echo "Native Linux smoke of exported binary"
            run_smoke "${{ matrix.output }}" --headless --quit-after 120
          else
            # Windows/macOS binaries cannot execute on Linux. Smoke the game
            # data (exported .pck) with the Linux engine; no native claim.
            pack="$(find '${{ matrix.artifact_path }}' -type f -name '*.pck' -print -quit)"
            if [ -z "$pack" ]; then
              echo "::error::no exported .pck found under '${{ matrix.artifact_path }}'"
              exit 1
            fi
            echo "::notice::${{ matrix.target }} executable cannot run on this Linux runner; smoke-testing only the exported game data ($pack) with the Linux Godot engine."
            run_smoke godot --headless --main-pack "$pack" --quit-after 120
          fi
          if grep -qE 'SCRIPT ERROR|Parse Error|Failed to load script' smoke.log; then
            echo "::error::exported build logged a script error"
            exit 1
          fi
      - name: Archive macOS bundle to preserve Unix modes
        if: matrix.target == 'macos'
        run: |
          # upload-artifact@v4 downloads files with mode 0644, which would make
          # the executable inside the .app bundle non-launchable. Tar it first
          # so the executable bit survives the upload/download round trip.
          archive="build/${{ steps.version.outputs.artifact }}"
          # Archive the whole export directory: besides the .app bundle it may
          # contain the external .pck referenced by the bundle.
          tar -czf "$archive" -C build/macos .
          test -s "$archive"
          tar -tvzf "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          # Directory paths keep external .pck files intact; the macOS path is
          # the mode-preserving tarball built above (same artifact name).
          path: ${{ steps.version.outputs.upload_path }}
          if-no-files-found: error
          retention-days: 14
